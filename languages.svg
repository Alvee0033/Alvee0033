<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 200" width="495" height="200">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="50%" stop-color="#00B4AB"/>
      <stop offset="100%" stop-color="#f1e05a"/>
    </linearGradient>
    <filter id="neonLangGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #00B4AB; letter-spacing: 1.5px; text-transform: uppercase; }
    .lang-name { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: start; }
  </style>

  <rect x="1.5" y="1.5" width="492" height="197" rx="12" fill="url(#langBg)" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 15 1.5 L 480 1.5" stroke="url(#langBorder)" stroke-width="2.5" stroke-linecap="round" filter="url(#neonLangGlow)"/>

  <!-- Card Header -->
  <g transform="translate(25, 28)">
    <circle cx="6" cy="6" r="4" fill="#00B4AB" filter="url(#neonLangGlow)"/>
    <text x="18" y="10" class="card-title">Top Languages by Codebase</text>
  </g>

  
    <!-- TypeScript: 37.0% -->
    <g transform="translate(0, 56)">
      <text x="25" y="10" class="lang-name">TypeScript</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="92" height="9" rx="4.5" fill="#3178c6" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">37.0%</text>
    </g>
    <!-- Dart: 20.9% -->
    <g transform="translate(0, 79)">
      <text x="25" y="10" class="lang-name">Dart</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="52" height="9" rx="4.5" fill="#00B4AB" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">20.9%</text>
    </g>
    <!-- JavaScript: 17.5% -->
    <g transform="translate(0, 102)">
      <text x="25" y="10" class="lang-name">JavaScript</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="43" height="9" rx="4.5" fill="#f1e05a" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">17.5%</text>
    </g>
    <!-- Python: 15.5% -->
    <g transform="translate(0, 125)">
      <text x="25" y="10" class="lang-name">Python</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="38" height="9" rx="4.5" fill="#3572A5" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">15.5%</text>
    </g>
    <!-- HTML: 4.9% -->
    <g transform="translate(0, 148)">
      <text x="25" y="10" class="lang-name">HTML</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="12" height="9" rx="4.5" fill="#e34c26" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">4.9%</text>
    </g>
    <!-- Other: 4.2% -->
    <g transform="translate(0, 171)">
      <text x="25" y="10" class="lang-name">Other</text>
      <rect x="125" y="1" width="250" height="9" rx="4.5" fill="#21262d"/>
      <rect x="125" y="1" width="10" height="9" rx="4.5" fill="#8b949e" filter="url(#neonLangGlow)"/>
      <text x="390" y="10" class="lang-pct">4.2%</text>
    </g>
</svg>