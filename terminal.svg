<svg viewBox="0 0 800 270" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>
    <filter id="neonTerm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="796" height="266" rx="10" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="796" height="34" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="2" y="24" width="796" height="12" fill="#161b22" />
  
  <!-- Window Control Buttons -->
  <circle cx="25" cy="18" r="6" fill="#ff5f56" />
  <circle cx="45" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="18" r="6" fill="#27c93f" />
  
  <!-- Window Title -->
  <text x="400" y="22" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600">alvee@engineer-node:~/portfolio</text>

  <!-- Terminal Content -->
  <g font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" font-size="13.5" font-weight="500">
    <!-- Line 1 -->
    <text x="35" y="70" fill="#c9d1d9">
      <tspan fill="#79c0ff" font-weight="bold">const</tspan> <tspan fill="#d2a8ff" font-weight="bold">developer</tspan> = {
    </text>
    
    <!-- Line 2 -->
    <text x="65" y="100" fill="#c9d1d9">
      <tspan fill="#7ee787">name</tspan>: <tspan fill="#a5d6ff">"Morsalin Islam Alvee"</tspan>,
    </text>

    <!-- Line 3 -->
    <text x="65" y="130" fill="#c9d1d9">
      <tspan fill="#7ee787">role</tspan>: <tspan fill="#a5d6ff">"Full-Stack Engineer &amp; AI Systems Developer"</tspan>,
    </text>
    
    <!-- Line 4 -->
    <text x="65" y="160" fill="#c9d1d9">
      <tspan fill="#7ee787">stack</tspan>: [<tspan fill="#a5d6ff">"TypeScript"</tspan>, <tspan fill="#a5d6ff">"Python"</tspan>, <tspan fill="#a5d6ff">"Next.js"</tspan>, <tspan fill="#a5d6ff">"Flutter"</tspan>, <tspan fill="#a5d6ff">"FastAPI"</tspan>],
    </text>
    
    <!-- Line 5 -->
    <text x="65" y="190" fill="#c9d1d9">
      <tspan fill="#7ee787">passion</tspan>: <tspan fill="#a5d6ff">"Architecting intelligent, high-throughput cloud &amp; AI systems"</tspan>,
    </text>
    
    <!-- Line 6 -->
    <text x="65" y="220" fill="#c9d1d9">
      <tspan fill="#7ee787">status</tspan>: <tspan fill="#58a6ff" filter="url(#neonTerm)">"Ready for high-impact open source &amp; collaborative builds"</tspan>
    </text>

    <!-- Line 7 -->
    <text x="35" y="250" fill="#c9d1d9">};</text>

    <!-- Glowing Cursor Animation -->
    <rect x="62" y="238" width="8" height="15" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
